# ── Database ──
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5433/${DB_NAME:biteflow}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none
# ── Flyway ──
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# ── JWT ──
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=https://biteflow.api
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
smallrye.jwt.new-token.lifespan=86400
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=biteflow_jwt
smallrye.jwt.always-check-authorization=true
# ── CORS (handled by CorsFilter.java) ──
quarkus.http.cors=false
# ── HTTP ──
quarkus.http.root-path=/
# ── Logging ──
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
# ── Dev mode ──
%dev.quarkus.log.level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true
# ── Feature Flags ──
biteflow.feature.ifood-integration.enabled=false
biteflow.feature.whatsapp-integration.enabled=false

# ── Google Cloud Pub/Sub (integração iFood) ──
quarkus.google.cloud.project-id=${GCP_PROJECT_ID:biteflow-dev}
%dev.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%dev.quarkus.google.cloud.pubsub.use-plaintext=true
%test.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%test.quarkus.google.cloud.pubsub.use-plaintext=true
#quarkus.log.file.enable=true
#quarkus.log.file.path=quarkus-error.log
