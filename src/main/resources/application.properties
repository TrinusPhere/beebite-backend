# ── Database ──
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:biteflow}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:biteflow}
%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:biteflow}
%test.quarkus.datasource.username=${DB_USER:postgres}
%test.quarkus.datasource.password=${DB_PASSWORD:postgres}

quarkus.hibernate-orm.database.generation=none
# ── Flyway ──
quarkus.flyway.migrate-at-start=true
quarkus.flyway.repair-at-start=true
quarkus.flyway.locations=classpath:db/migration
# ── JWT ──
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://biteflow.api}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
smallrye.jwt.new-token.lifespan=86400
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=biteflow_jwt
smallrye.jwt.always-check-authorization=true
biteflow.auth.cookie.secure=${BEEBITE_COOKIE_SECURE:${BITEFLOW_COOKIE_SECURE:true}}
biteflow.auth.cookie.same-site=${BEEBITE_COOKIE_SAME_SITE:${BITEFLOW_COOKIE_SAME_SITE:Lax}}
%dev.biteflow.auth.cookie.secure=false
%test.biteflow.auth.cookie.secure=false
biteflow.security.enforce-prod-guards=${BEEBITE_ENFORCE_PROD_GUARDS:${BITEFLOW_ENFORCE_PROD_GUARDS:true}}
biteflow.security.initial-admin-password=${BEEBITE_INITIAL_ADMIN_PASSWORD:${BITEFLOW_INITIAL_ADMIN_PASSWORD:}}
%dev.biteflow.security.enforce-prod-guards=false
%test.biteflow.security.enforce-prod-guards=false
# ── CORS (handled by CorsFilter.java) ──
quarkus.http.cors=false
# ── HTTP ──
quarkus.http.root-path=/
# Porta de testes para não colidir com outros serviços locais (ex: ifood-service na 8081)
%test.quarkus.http.test-port=8083
# ── Logging ──
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
%dev.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=logs/biteflow.log
%dev.quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=5
%test.quarkus.log.file.enable=false
# ── OpenAPI ──
quarkus.smallrye-openapi.info-title=BeeBite Backend API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=BeeBite - API de Gestao e PDV
quarkus.swagger-ui.always-include=true

# ── Dev mode ──

%dev.quarkus.hibernate-orm.log.sql=true
# Suprime logs ruidosos do Pub/Sub (ack-batch FINE) em todos os ambientes
quarkus.log.category."ack-batch".level=WARN
quarkus.log.category."com.google.cloud.pubsub".level=WARN
quarkus.log.category."io.grpc".level=WARN
# ── Feature Flags ──
biteflow.feature.ifood-integration.enabled=${BEEBITE_IFOOD_ENABLED:${BITEFLOW_IFOOD_ENABLED:true}}
biteflow.feature.whatsapp-integration.enabled=false

# ── Sincronização Híbrida (CLOUD | EDGE) ──
biteflow.sync.mode=${BEEBITE_SYNC_MODE:${BITEFLOW_SYNC_MODE:CLOUD}}
biteflow.sync.cloud-url=${BEEBITE_CLOUD_SYNC_URL:${BITEFLOW_CLOUD_SYNC_URL:https://api.trinusphere.com}}
biteflow.sync.edge-device-token=${BEEBITE_EDGE_DEVICE_TOKEN:${BITEFLOW_EDGE_DEVICE_TOKEN:none}}
biteflow.sync.poll-interval=${BEEBITE_EDGE_SYNC_INTERVAL:${BITEFLOW_EDGE_SYNC_INTERVAL:15s}}
biteflow.sync.cursor-probe-interval=${BEEBITE_EDGE_CURSOR_PROBE_INTERVAL:5m}
biteflow.sync.reconcile-interval=${BEEBITE_EDGE_RECONCILE_INTERVAL:6h}
biteflow.sync.reconcile-window-days=${BEEBITE_EDGE_RECONCILE_WINDOW_DAYS:7}
biteflow.sync.outbox-retention-days=${BEEBITE_EDGE_OUTBOX_RETENTION_DAYS:30}
biteflow.sync.event-log-retention-days=${BEEBITE_SYNC_EVENT_LOG_RETENTION_DAYS:90}
biteflow.sync.purge-cron=${BEEBITE_SYNC_PURGE_CRON:0 30 3 * * ?}
biteflow.edge.store-id=${BEEBITE_EDGE_STORE_ID:}
biteflow.edge.catalog-id=${BEEBITE_EDGE_CATALOG_ID:}
biteflow.edge.store-name=${BEEBITE_EDGE_STORE_NAME:}
biteflow.edge.store-slug=${BEEBITE_EDGE_STORE_SLUG:}
biteflow.edge.store-address=${BEEBITE_EDGE_STORE_ADDRESS:}
biteflow.edge.admin-login=${BEEBITE_EDGE_ADMIN_LOGIN:admin}
biteflow.internal.service-token=${BEEBITE_INTERNAL_SERVICE_TOKEN:${BITEFLOW_INTERNAL_SERVICE_TOKEN:beebite-internal-dev-token}}
%test.biteflow.sync.edge-device-token=test-token

# ── Google Cloud Pub/Sub (integração iFood) ──
quarkus.google.cloud.project-id=${GCP_PROJECT_ID:beebite-dev}
%dev.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%dev.quarkus.google.cloud.pubsub.use-plaintext=true
%test.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%test.quarkus.google.cloud.pubsub.use-plaintext=true
#quarkus.log.file.enable=true
#quarkus.log.file.path=quarkus-error.log
