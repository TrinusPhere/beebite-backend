# ═══════════════════════════════════════════════════════════════════════════
# docker-compose.cloud.yml — Nuvem Central (GCP us-east1 - e2-micro Free Tier)
# - 1 instância PostgreSQL 17 com 2 bancos lógicos (beebite + beebite_ifood)
# - beebite-backend (Quarkus Native, Modo CLOUD, Multi-Loja + Ingestão Edge Sync)
# - beebite-ifood-service (Quarkus Native, Polling iFood 30s + Cloud Pub/Sub)
# - Caddy Reverse Proxy (HTTPS / TLS automático)
# ═══════════════════════════════════════════════════════════════════════════
services:
  postgres:
    image: postgres:17-alpine
    container_name: beebite-postgres-cloud
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: beebite
    volumes:
      - pgdata_cloud:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=60
      -c work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d beebite"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  beebite-backend:
    image: us-east1-docker.pkg.dev/${GCP_PROJECT_ID:-trinusphere-beebite-prd}/beebite-repo/beebite-backend:${APP_VERSION:-latest}
    container_name: beebite-backend-cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      DB_HOST: postgres
      DB_NAME: beebite
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PRIVATE_KEY_LOCATION: file:/secrets/privateKey.pem
      JWT_PUBLIC_KEY_LOCATION: file:/secrets/publicKey.pem
      BEEBITE_COOKIE_SECURE: "true"
      BEEBITE_COOKIE_SAME_SITE: Lax
      BEEBITE_ENFORCE_PROD_GUARDS: "true"
      BEEBITE_INITIAL_ADMIN_PASSWORD: ${BEEBITE_INITIAL_ADMIN_PASSWORD}
      BITEFLOW_INITIAL_ADMIN_PASSWORD: ${BEEBITE_INITIAL_ADMIN_PASSWORD}
      BITEFLOW_SECURITY_INITIAL_ADMIN_PASSWORD: ${BEEBITE_INITIAL_ADMIN_PASSWORD}
      BEEBITE_SYNC_MODE: CLOUD
      BEEBITE_IFOOD_ENABLED: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-trinusphere-beebite-prd}
    volumes:
      - ./secrets:/secrets:ro
    deploy:
      resources:
        limits:
          memory: 192M

  beebite-ifood:
    image: us-east1-docker.pkg.dev/${GCP_PROJECT_ID:-trinusphere-beebite-prd}/beebite-repo/beebite-ifood-service:${APP_VERSION:-latest}
    container_name: beebite-ifood-cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      DB_HOST: postgres
      DB_NAME: beebite_ifood
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      IFOOD_ENCRYPTION_KEY: ${IFOOD_ENCRYPTION_KEY:?Defina IFOOD_ENCRYPTION_KEY no arquivo .env}
      BEEBITE_ENFORCE_PROD_KEY: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-trinusphere-beebite-prd}
      BEEBITE_IMAGE_STORAGE_DIR: /data/images/catalog
      BEEBITE_IMAGE_PUBLIC_BASE_URL: https://${API_DOMAIN:-api.trinusphere.com}/api/images
      BEEBITE_API_BASE_URL: http://beebite-backend:8080
    volumes:
      - ./uploads/images:/data/images/catalog
    deploy:
      resources:
        limits:
          memory: 192M

  caddy:
    image: caddy:2-alpine
    container_name: beebite-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.trinusphere.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - beebite-backend
      - beebite-ifood
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  pgdata_cloud:
  caddy_data:
  caddy_config:
