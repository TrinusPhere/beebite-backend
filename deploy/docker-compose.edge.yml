# ═══════════════════════════════════════════════════════════════════════════
# docker-compose.edge.yml — Unidade Local Offline-First (Balcão / PDV) — BeeBite
# - Funciona 100% sem internet na rede local (http://localhost ou IP da máquina)
# - Quando BEEBITE_SYNC_MODE=EDGE, sincroniza automaticamente a cada 15s
#   com a Nuvem Central (https://api.trinusphere.com)
# - Atualiza sozinho de madrugada às 04:00 AM via Watchtower
# ═══════════════════════════════════════════════════════════════════════════
services:
  postgres-local:
    image: postgres:17-alpine
    container_name: beebite-postgres-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: beebite_edge
      POSTGRES_USER: beebite
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:?Defina EDGE_DB_PASSWORD no arquivo .env}
    volumes:
      - pgdata_edge:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebite -d beebite_edge"]
      interval: 10s
      timeout: 5s
      retries: 5

  beebite-edge-api:
    image: ${GCP_REGION:-us-east1}-docker.pkg.dev/${GCP_PROJECT_ID:-trinusphere-beebite-prd}/beebite-repo/beebite-backend:${APP_VERSION:-latest}
    build:
      context: ./beebite-backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: beebite-edge-api
    restart: unless-stopped
    depends_on:
      postgres-local:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      DB_HOST: postgres-local
      DB_NAME: beebite_edge
      DB_USER: beebite
      DB_PASSWORD: ${EDGE_DB_PASSWORD}
      BEEBITE_COOKIE_SECURE: "false"
      BEEBITE_COOKIE_SAME_SITE: Lax
      BEEBITE_ENFORCE_PROD_GUARDS: "true"
      BEEBITE_INITIAL_ADMIN_PASSWORD: ${EDGE_INITIAL_ADMIN_PASSWORD:?Defina EDGE_INITIAL_ADMIN_PASSWORD no arquivo .env}
      BEEBITE_IFOOD_ENABLED: "false"
      BEEBITE_SYNC_MODE: ${BEEBITE_SYNC_MODE:-EDGE}
      BEEBITE_CLOUD_SYNC_URL: ${CLOUD_SYNC_URL:-https://api.trinusphere.com}
      BEEBITE_EDGE_DEVICE_TOKEN: ${EDGE_DEVICE_TOKEN:?Defina EDGE_DEVICE_TOKEN no arquivo .env}
      BEEBITE_EDGE_SYNC_INTERVAL: 15s
      BEEBITE_EDGE_STORE_ID: ${BEEBITE_EDGE_STORE_ID:-}
      BEEBITE_EDGE_STORE_NAME: ${BEEBITE_EDGE_STORE_NAME:-}
      BEEBITE_EDGE_STORE_SLUG: ${BEEBITE_EDGE_STORE_SLUG:-}
      BEEBITE_EDGE_STORE_ADDRESS: ${BEEBITE_EDGE_STORE_ADDRESS:-}
      BEEBITE_EDGE_ADMIN_LOGIN: ${BEEBITE_EDGE_ADMIN_LOGIN:-admin}
    ports:
      - "8080:8080"

  beebite-edge-front:
    image: ${GCP_REGION:-us-east1}-docker.pkg.dev/${GCP_PROJECT_ID:-trinusphere-beebite-prd}/beebite-repo/beebite-front:${APP_VERSION:-latest}
    build:
      context: ./beebite-front
      dockerfile: Dockerfile
    container_name: beebite-edge-front
    restart: unless-stopped
    depends_on:
      - beebite-edge-api
    ports:
      - "80:80"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: beebite-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      TZ: America/Sao_Paulo

volumes:
  pgdata_edge:
